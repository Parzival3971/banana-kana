name: Build (aarch64)

# Builds and tests the app on arm64 (QEMU) for every push/PR. Does NOT create releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    # Fast feedback: native build, core tests and the UI self-test with dummy video.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libsdl2-dev libsdl2-ttf-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: UI self-test
        run: SDL_VIDEODRIVER=dummy KT_SOFTWARE=1 build/banana_kana --selftest --state-dir "$RUNNER_TEMP/kt" --data app/data
      - name: Release notes for VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "$v" != "0.0.0" ]; then ./scripts/release-notes.sh "$v" /dev/null; else echo "VERSION is the 0.0.0 placeholder"; fi

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build, test and self-test on arm64
        run: ./scripts/docker-build-aarch64.sh
      - name: Show requirements
        run: cat dist/aarch64/REQUIREMENTS.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package dry run (not a release)
        run: ./scripts/package.sh 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: banana_kana-aarch64
          path: |
            dist/aarch64/
            dist/*.zip
